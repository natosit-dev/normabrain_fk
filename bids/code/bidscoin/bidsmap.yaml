$schema: schema.json
Options:
  bidscoin:
    version: 4.6.2
    subprefix: sub-
    sesprefix: ses-
    bidsignore:
    - extra_data/
    - sub-*_ct.*
    unknowntypes:
    - extra_data
    ignoretypes:
    - exclude
    anon: y
    stripsuffix: y
    unzip: null
  plugins:
    dcm2niix2bids:
      command: dcm2niix
      args: -b y -z y -i n -l n
      meta:
      - .json
      - .tsv
      - .tsv.gz
      fallback: y
    events2bids:
      extraInfo: 7
      meta:
      - .json
DICOM:
  participant:
    participant_id:
      value: <<filepath:/raw/sub-(.*?)_.*?/>>
      meta:
        Description: The unique participant identifier of the form sub-<label>, matching
          a participant entity found in the dataset
    session_id:
      value: <<filepath:/raw/sub-.*?_ses-(.*?)_.*?/>>
      meta:
        Description: The session identifier of the form ses-<label>, matching a session
          found in the dataset
    age<<session_id>>:
      value: <<PatientAge>>
      meta:
        Description: Age of the participant at the time of the acquired session
        Units: year
    sex:
      value: <<PatientSex>>
      meta:
        Description: Sex of the participant
        Levels:
          M: male
          F: female
          O: other
    height:
      value: <<PatientSize>>
      meta:
        Description: Height of the participant
        Units: meter
    weight:
      value: <<PatientWeight>>
      meta:
        Description: Weight of the participant
        Units: kilogram
